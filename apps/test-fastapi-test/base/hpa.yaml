apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: test-fastapi-test
  labels:
    app: test-fastapi-test
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: test-fastapi-test
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
