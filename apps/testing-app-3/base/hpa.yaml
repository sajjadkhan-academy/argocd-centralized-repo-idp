apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: testing-app-3
  labels:
    app: testing-app-3
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: testing-app-3
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
