apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: new-microservice-team-a
  labels:
    app: new-microservice-team-a
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: new-microservice-team-a
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
