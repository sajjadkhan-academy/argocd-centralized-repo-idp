apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sajjdkhan-9090
  labels:
    app: sajjdkhan-9090
    backstage.io/kubernetes-id: sajjdkhan-9090
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sajjdkhan-9090
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
