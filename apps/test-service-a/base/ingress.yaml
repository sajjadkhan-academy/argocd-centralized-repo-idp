apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: test-service-a
  labels:
    app: test-service-a
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - host: test-service-a.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: test-service-a
                port:
                  number: 80
