apiVersion: v1
kind: Service
metadata:
  name: new-test-m-argo
  labels:
    app: new-test-m-argo
    backstage.io/kubernetes-id: new-test-m-argo
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "80"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app: new-test-m-argo
  ports:
    - name: http
      port: 80
      targetPort: 8070
      protocol: TCP
