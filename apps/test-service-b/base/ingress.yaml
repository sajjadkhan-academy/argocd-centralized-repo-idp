apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: test-service-b
  labels:
    app: test-service-b
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - host: test-service-b.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: test-service-b
                port:
                  number: 80
