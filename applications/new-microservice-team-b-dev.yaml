apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: new-microservice-team-b-dev
  namespace: argocd
  labels:
    app: new-microservice-team-b
    environment: dev
spec:
  project: default
  source:
    repoURL: https://github.com/sajjadkhan-academy/argocd-centralized-repo-idp.git
    targetRevision: main
    path: apps/new-microservice-team-b/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: new-microservice-team-b
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
